name: Build and test Docker

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/fzimmermann89/mr2_py312

jobs:
  validate-pr:
    name: Build and test recommended image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile_py312
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:candidate
          cache-from: type=gha,scope=mr2_py312
          cache-to: type=gha,mode=max,scope=mr2_py312

      - name: Run PyTest in candidate image
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          docker run --rm \
            -e ZENODO_TOKEN \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /tmp \
            "${IMAGE_NAME}:candidate" \
            bash -lc 'python -c "import torch; assert torch.__version__.startswith(\"2.10.0\"); assert torch.version.cuda is None; print(torch.__version__)" && python -m pip install --user --no-cache-dir pytest pytest-cov coverage codecov pytest-github-actions-annotate-failures && python -m pytest /workspace/tests -m "not cuda"'

  publish:
    name: Build, test, and publish recommended image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile_py312
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:candidate
          cache-from: type=gha,scope=mr2_py312
          cache-to: type=gha,mode=max,scope=mr2_py312

      - name: Run PyTest in candidate image
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          docker run --rm \
            -e ZENODO_TOKEN \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /tmp \
            "${IMAGE_NAME}:candidate" \
            bash -lc 'python -c "import torch; assert torch.__version__.startswith(\"2.10.0\"); assert torch.version.cuda is None; print(torch.__version__)" && python -m pip install --user --no-cache-dir pytest pytest-cov coverage codecov pytest-github-actions-annotate-failures && python -m pytest /workspace/tests -m "not cuda"'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        run: |
          docker tag "${IMAGE_NAME}:candidate" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
