name: PyTest

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.environment }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: minimum
            python-version: "3.10"
            requirements: ci/requirements/minimum.txt
            coverage: false
          - environment: recommended
            python-version: "3.12"
            requirements: ci/requirements/recommended.txt
            coverage: true
          - environment: latest
            python-version: "3.14"
            requirements: ""
            coverage: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/requirements/*.txt

      - name: Install pinned environment
        if: matrix.requirements != ''
        run: python -m pip install -r "${{ matrix.requirements }}"

      - name: Install latest CPU PyTorch
        if: matrix.environment == 'latest'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install MRtwo and test dependencies
        run: python -m pip install ".[tests]" pytest-github-actions-annotate-failures

      - name: Show resolved environment
        run: python -c "import platform, torch; print(platform.python_version()); print(torch.__version__)"

      - name: Run tests
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        shell: bash
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            python -m pytest -m "not cuda" --junitxml=pytest.xml \
              --cov-report=term-missing:skip-covered --cov=mr2 | tee pytest-coverage.txt
          else
            python -m pytest -m "not cuda"
          fi

      - name: Upload recommended PyTest coverage report
        if: always() && matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-recommended
          path: |
            pytest-coverage.txt
            pytest.xml
          if-no-files-found: ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
