name: Report PyTest

on:
  workflow_run:
    workflows:
      - PyTest
      - PyTest CUDA
    types:
      - completed

jobs:
  coverage_report_pr:
    name: Coverage report
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion != 'cancelled' &&
          github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    concurrency:
      group: pytest-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Find matching PyTest runs
        id: report_runs
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const isCuda = run.name === 'PyTest CUDA';
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: isCuda ? 'pytest.yml' : 'pytest_cuda.yml',
              head_sha: run.head_sha,
              event: run.event,
              status: 'completed',
              per_page: 100,
            });
            const matchingRun = data.workflow_runs.find(candidate =>
              candidate.head_repository.id === run.head_repository.id &&
              candidate.head_branch === run.head_branch &&
              !['cancelled', 'skipped'].includes(candidate.conclusion)
            );
            core.setOutput('cpu-run-id', (isCuda ? matchingRun : run)?.id ?? '');
            core.setOutput('cuda-run-id', (isCuda ? run : matchingRun)?.id ?? '');

      # Use the recommended Python 3.12 / PyTorch 2.10 environment as target platform.
      - name: Download recommended PyTest report artifact
        id: download_report
        if: steps.report_runs.outputs.cpu-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pytest-report-recommended
          run-id: ${{ steps.report_runs.outputs.cpu-run-id }}
          # needs to be explicitly set
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CUDA PyTest report artifact
        id: download_cuda
        if: steps.report_runs.outputs.cpu-run-id != '' && steps.report_runs.outputs.cuda-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pytest-report-cuda
          run-id: ${{ steps.report_runs.outputs.cuda-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR number
        id: pr-context
        if: steps.report_runs.outputs.cpu-run-id != ''
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: pulls } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pull = pulls.find(candidate =>
              candidate.head.sha === run.head_sha &&
              candidate.head.repo.id === run.head_repository.id
            );
            if (pull) core.setOutput('number', pull.number);

      - name: Post PyTest Coverage Comment
        id: coverage_comment
        if: steps.download_report.outcome == 'success' && steps.pr-context.outputs.number != ''
        uses: MishaKav/pytest-coverage-comment@v1.7.1
        with:
          issue-number: ${{ steps.pr-context.outputs.number }}
          pytest-coverage-path: pytest-coverage.txt
          multiple-files: |
            CPU (recommended), pytest-coverage.txt, pytest.xml
            ${{ steps.download_cuda.outcome == 'success' && 'CUDA, , pytest-cuda.xml' || '' }}

      - name: Post Failure Comment if Coverage Comment failed
        if: >-
          !cancelled() && steps.pr-context.outputs.number != '' &&
          (steps.download_report.outcome != 'success' || steps.coverage_comment.outputs.coverageHtml == '')
        uses: edumserrano/find-create-or-update-comment@v3
        with:
          issue-number: ${{ steps.pr-context.outputs.number }}
          # see https://github.com/MishaKav/pytest-coverage-comment/blob/81882822c5b22af01f91bd3eacb1cefb6ad73dc2/src/index.js#L97
          # for the generation of the unique id for comment
          # in this particular case, there is no additional watermarkUniqueId
          body-includes: '<!-- Pytest Coverage Comment: ${{ github.job }} -->'
          comment-author: 'github-actions[bot]'
          body: |
            <!-- Pytest Coverage Comment: ${{ github.job }} -->
            ### :x: PyTest Coverage Report was not found

            Check the PyTest Workflow
          edit-mode: replace

  coverage_report_push_main:
    name: Coverage report push main
    if: >-
      ${{ github.event.workflow_run.name == 'PyTest' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pytest-report-recommended

      - name: Post PyTest Coverage Comment on push main
        id: coverage_comment
        uses: MishaKav/pytest-coverage-comment@v1.7.1
        with:
          pytest-coverage-path: pytest-coverage.txt
          junitxml-path: pytest.xml

      - name: Create Coverage Badge on Main Branch Push
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f688ae5c6e8daec44ac7f8fc4067e93f
          filename: coverage.json
          label: Coverage Report
          message: ${{ steps.coverage_comment.outputs.coverage }}
          color: ${{ steps.coverage_comment.outputs.color }}
          namedLogo: python
