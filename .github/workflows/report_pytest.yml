name: Report PyTest

on:
  workflow_run:
    workflows:
      - PyTest
      - PyTest CUDA
    types:
      - completed

permissions: {}

jobs:
  coverage_report_pr:
    name: Coverage report
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          (github.event.workflow_run.conclusion != 'cancelled' || github.event.workflow_run.name == 'PyTest CUDA') &&
          github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: pytest-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Find PR and test runs
        id: reports
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: pulls } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pull = pulls.find(candidate =>
              candidate.head.sha === run.head_sha &&
              candidate.head.repo?.id === run.head_repository.id
            );
            if (!pull) return;

            const isCuda = run.name === 'PyTest CUDA';
            const isFork = pull.head.repo.id !== context.payload.repository.id;
            if (isCuda && isFork) return;

            let matchingRun;
            if (!isFork) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: isCuda ? 'pytest.yml' : 'pytest_cuda.yml',
                head_sha: run.head_sha,
                event: 'pull_request',
                per_page: 100,
              });
              matchingRun = data.workflow_runs.find(candidate =>
                candidate.head_repository.id === run.head_repository.id &&
                candidate.head_branch === run.head_branch &&
                (!isCuda || (candidate.status === 'completed' &&
                  !['cancelled', 'skipped'].includes(candidate.conclusion)))
              );
            }
            const cpuRun = isCuda ? matchingRun : run;
            const cudaRun = isCuda ? run : matchingRun;
            if (!cpuRun) return;

            core.setOutput('number', pull.number);
            core.setOutput('cpu-run-id', cpuRun.id);
            core.setOutput('cuda-run-id', cudaRun?.status === 'completed' ? cudaRun.id : '');
            let note = isFork ? 'CUDA skipped for fork PR' : 'CUDA results pending';
            if (cudaRun?.status === 'completed') {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: cudaRun.id, per_page: 100,
              });
              const test = data.jobs.find(job => job.name === 'Test CUDA (Python 3.12)');
              note = test && !test.runner_id ? 'CUDA skipped (runner unavailable)' : 'CUDA report unavailable';
            }
            core.setOutput('cuda-note', note);

      - name: Checkout trusted report merger
        if: steps.reports.outputs.number != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Use the recommended Python 3.12 / PyTorch 2.10 environment as target platform.
      - name: Download recommended PyTest report artifact
        id: download_report
        if: steps.reports.outputs.number != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pytest-report-recommended
          path: ${{ runner.temp }}/pytest-cpu
          run-id: ${{ steps.reports.outputs.cpu-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CUDA PyTest report artifact
        id: download_cuda
        if: steps.reports.outputs.number != '' && steps.reports.outputs.cuda-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pytest-report-cuda
          path: ${{ runner.temp }}/pytest-cuda
          run-id: ${{ steps.reports.outputs.cuda-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine CPU and CUDA test results
        if: steps.download_report.outcome == 'success'
        env:
          REPORT_DIR: ${{ runner.temp }}
        run: |
          python -m pip install --quiet --target "$REPORT_DIR/pytest-report-deps" defusedxml==0.7.1
          PYTHONPATH="$REPORT_DIR/pytest-report-deps" python .github/scripts/merge_pytest_reports.py \
            "$REPORT_DIR/pytest-cpu/pytest.xml" \
            "$REPORT_DIR/pytest-cuda/pytest-cuda.xml" \
            "$REPORT_DIR/pytest-combined.xml"

      - name: Post PyTest Coverage Comment
        id: coverage_comment
        if: steps.download_report.outcome == 'success'
        uses: MishaKav/pytest-coverage-comment@v1.7.1
        with:
          issue-number: ${{ steps.reports.outputs.number }}
          title: Coverage Report${{ steps.download_cuda.outcome != 'success' && format(' ({0})', steps.reports.outputs.cuda-note) || '' }}
          pytest-coverage-path: ${{ runner.temp }}/pytest-cpu/pytest-coverage.txt
          junitxml-path: ${{ runner.temp }}/pytest-combined.xml

      - name: Post Failure Comment if Coverage Comment failed
        if: >-
          !cancelled() && steps.reports.outputs.number != '' &&
          (steps.download_report.outcome != 'success' || steps.coverage_comment.outcome == 'failure' ||
           steps.coverage_comment.outputs.coverageHtml == '')
        uses: edumserrano/find-create-or-update-comment@v3
        with:
          issue-number: ${{ steps.reports.outputs.number }}
          body-includes: '<!-- Pytest Coverage Comment: ${{ github.job }} -->'
          comment-author: 'github-actions[bot]'
          body: |
            <!-- Pytest Coverage Comment: ${{ github.job }} -->
            ### :x: PyTest Coverage Report was not found

            Check the PyTest Workflow
          edit-mode: replace

  coverage_report_push_main:
    name: Coverage report push main
    if: >-
      ${{ github.event.workflow_run.name == 'PyTest' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pytest-report-recommended

      - name: Post PyTest Coverage Comment on push main
        id: coverage_comment
        uses: MishaKav/pytest-coverage-comment@v1.7.1
        with:
          pytest-coverage-path: pytest-coverage.txt
          junitxml-path: pytest.xml

      - name: Create Coverage Badge on Main Branch Push
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: f688ae5c6e8daec44ac7f8fc4067e93f
          filename: coverage.json
          label: Coverage Report
          message: ${{ steps.coverage_comment.outputs.coverage }}
          color: ${{ steps.coverage_comment.outputs.color }}
          namedLogo: python
