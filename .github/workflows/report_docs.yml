name: Report Docs

on:
  workflow_run:
    workflows:
      - Sphinx Docs
    types:
      - completed

jobs:
  docs_report:
    name: Docs report
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion != 'cancelled' &&
          github.event.workflow_run.conclusion != 'skipped' }}
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Get PR number
        id: pr-context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TARGET_REPO: ${{ github.repository }}
          PR_BRANCH: |-
            ${{
              (github.event.workflow_run.head_repository.owner.login != github.event.workflow_run.repository.owner.login)
                && format('{0}:{1}', github.event.workflow_run.head_repository.owner.login, github.event.workflow_run.head_branch)
                || github.event.workflow_run.head_branch
            }}
        run: |
          gh pr view --repo "${PR_TARGET_REPO}" "${PR_BRANCH}" \
              --json 'number' --jq '"number=\(.number)"' \
              >> "${GITHUB_OUTPUT}"

      - name: Download documentation metadata
        if: github.event.workflow_run.conclusion == 'success'
        id: download_metadata
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: artifact_url

      - name: Set documentation artifact URL
        if: steps.download_metadata.outcome == 'success'
        run: echo "DOCS_ARTIFACT_URL=$(cat artifact_url)" >> "${GITHUB_ENV}"

      - name: Update PR with documentation link
        if: env.DOCS_ARTIFACT_URL != ''
        uses: edumserrano/find-create-or-update-comment@v3
        with:
          issue-number: ${{ steps.pr-context.outputs.number }}
          body-includes: '<!-- documentation build ${{ steps.pr-context.outputs.number }} -->'
          comment-author: 'github-actions[bot]'
          body: |
            <!-- documentation build ${{ steps.pr-context.outputs.number }} -->
            ### :books: Documentation
            :file_folder: [Download as zip](${{ env.DOCS_ARTIFACT_URL }})
            :mag: [View online](https://zimf.de/zipserve/${{ env.DOCS_ARTIFACT_URL }}/)
          edit-mode: replace

      - name: Report documentation build failure
        if: github.event.workflow_run.conclusion != 'success' || env.DOCS_ARTIFACT_URL == ''
        uses: edumserrano/find-create-or-update-comment@v3
        with:
          issue-number: ${{ steps.pr-context.outputs.number }}
          body-includes: '<!-- documentation build ${{ steps.pr-context.outputs.number }} -->'
          comment-author: 'github-actions[bot]'
          body: |
            <!-- documentation build ${{ steps.pr-context.outputs.number }} -->
            ### :books: Documentation
            :x: Documentation build did not produce a report (`${{ github.event.workflow_run.conclusion }}`)

            Check the Sphinx Docs Workflow
          edit-mode: replace

  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: Documentation
          path: html_build

      - name: Upload pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: html_build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
