name: PyTest CUDA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue_timeout:
    name: Limit CUDA queue wait
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
    steps:
      - name: Cancel CUDA if it does not start within ten minutes
        uses: actions/github-script@v8
        with:
          script: |
            const run_id = context.runId;
            const deadline = Date.now() + 10 * 60 * 1000;
            while (true) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id, per_page: 100,
              });
              const cuda = jobs.find(job => job.name === 'Test CUDA (Python 3.12)');
              if (cuda && ['in_progress', 'completed'].includes(cuda.status)) return;
              if (Date.now() >= deadline) {
                core.notice('CUDA did not start within ten minutes; cancelling this run.');
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id });
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }

  test:
    name: Test CUDA (Python 3.12)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, cuda]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install pinned environment
        run: python -m pip install -r ci/requirements/cuda.txt

      - name: Install MRtwo and test dependencies
        run: python -m pip install ".[tests]" pytest-github-actions-annotate-failures

      - name: Check CUDA
        run: |
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA is not available'; print(torch.__version__); print(torch.cuda.get_device_name(0))"

      - name: Run CUDA tests
        run: python -m pytest -m cuda --junitxml=pytest-cuda.xml

      - name: Upload CUDA PyTest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-cuda
          path: pytest-cuda.xml
          if-no-files-found: ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
