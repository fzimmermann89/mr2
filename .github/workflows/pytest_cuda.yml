name: PyTest CUDA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test CUDA (Python 3.12)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, cuda]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/requirements/cuda.txt

      - name: Install pinned environment
        run: python -m pip install -r ci/requirements/cuda.txt

      - name: Install MRtwo and test dependencies
        run: python -m pip install ".[tests]" pytest-github-actions-annotate-failures

      - name: Check CUDA
        run: |
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA is not available'; print(torch.__version__); print(torch.cuda.get_device_name(0))"

      - name: Run CUDA tests
        run: python -m pytest -m cuda

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
